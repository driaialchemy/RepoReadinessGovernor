# Reviewed accepted-risk exceptions for Repo Governor.
#
# An exception moves a finding from "blocking" to "accepted" (it still appears
# in the report under "Accepted risks"). Rules:
#   - Every entry needs reason, approved_by and approved_on, or it is ignored.
#   - Scope is narrow: named providers/config files (terms) or file globs (paths).
#     A new provider, database, config file or spreadsheet is flagged again.
#   - Never exceptable: committed secret files, credential patterns in code,
#     missing version control. Those categories are rejected by the loader.
#
# Categories: ai_providers, external_database, cloud_deployment (terms);
#             spreadsheet_files, database_files, log_files (paths);
#             context_signals (terms: dependency_manifests, containers, ci_cd,
#             http_libraries, test_suite, node_modules, large_file_count).
version: 1
repos:
  AgentGovernanceHub:
    accepted:
      - category: ai_providers
        terms: [openai]
        reason: OpenAI is the product's intended LLM integration; keys come from environment variables
        approved_by: Dr. Michael Seller
        approved_on: "2026-11-06"
      - category: external_database
        terms: [postgres]
        reason: Postgres is the application's intended datastore; connection strings come from environment variables
        approved_by: Dr. Michael Seller
        approved_on: "2026-11-06"
      - category: context_signals
        terms: [dependency_manifests, http_libraries]
        reason: Normal project structure; CLAUDE.md, AGENTS.md, README and .gitignore are present
        approved_by: Dr. Michael Seller
        approved_on: "2026-11-06"

